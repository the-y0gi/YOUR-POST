<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Branding Icon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>YOUR POST | Premium Social Experience</title>
    <meta name="title" content="YOUR POST | Premium Social Experience" />
    <meta
      name="description"
      content="A premium social space to share your thoughts. Experience high-end UI/UX with YOUR POST."
    />
    <meta name="author" content="Yogesh Gadhewal" />

    <!-- Google Fonts (Space Grotesk for that premium look) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-post-app.vercel.app/" />
    <meta property="og:title" content="YOUR POST | Premium Social Experience" />
    <meta
      property="og:description"
      content="Share your stories in a premium social environment."
    />
    <meta property="og:image" content="/og-banner.png" />

    <!-- Twitter Preview -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://your-post-app.vercel.app/" />
    <meta property="twitter:title" content="YOUR POST" />
    <meta
      property="twitter:description"
      content="Experience the next level of social interaction."
    />
    <meta property="twitter:image" content="/og-banner.png" />

    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#0A0A0A" />
  </head>
  <body class="bg-darkBg text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
